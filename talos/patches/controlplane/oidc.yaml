apiVersion: v1alpha1
kind: KubeAuthenticationConfig
configuration:
  anonymous:
    conditions:
      - path: /livez
      - path: /readyz
      - path: /healthz
    enabled: true
  jwt:
    - issuer:
        url: "https://auth.engiqueersconcordia.ca/application/o/kubernetes/"
        audiences:
          - "4pGcLoncz8FeFcp7c9EmSo2fEfc4XS3DqO9Djlnn"
      claimMappings:
        username:
          claim: "preferred_username"
          prefix: "oidc:"
        groups:
          claim: "groups"
          prefix: "oidc-group:"
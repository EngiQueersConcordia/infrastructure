apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: jupyterhub
  name: hub
  namespace: jupyterhub-user
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jupyterhub-hub
subjects:
  - kind: ServiceAccount
    name: hub
    namespace: jupyterhub
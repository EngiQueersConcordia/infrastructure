apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: ingress
spec:
  parentRefs:
    - name: engiqueers-insecure
  hostnames:
    - "engiqueersconcordia.ca"
    - "*.engiqueersconcordia.ca"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 302
      matches:
        - path:
            type: PathPrefix
            value: /
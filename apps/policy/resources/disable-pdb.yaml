apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: deny-pod-disruption-budgets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["policy"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["poddisruptionbudgets"]
        scope: Namespaced
  validations:
    - expression: "false"
      message: "PodDisruptionBudgets are disabled cluster-wide."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: deny-pod-disruption-budgets
spec:
  policyName: deny-pod-disruption-budgets
  validationActions:
    - Deny

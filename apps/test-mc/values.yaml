resources:
  requests:
    memory: 4Gi

minecraftServer:
  eula: "TRUE"
  version: "26.1.2"
  type: "PAPER"
  ops: "alexkar598"
  gameMode: "creative"
  motd: "EngiQueers Test Server"

  memory: 4G
  rcon:
    enabled: true
    withGeneratedPassword: true

workloadAsStatefulSet: true
strategyType: RollingUpdate
serviceAnnotations:
  "mc-router.itzg.me/externalServerName": "testmc.engiqueersconcordia.ca"

extraVolumes:
  - volumes:
      - configMap:
          name: test-mc-config
          defaultMode: 0777
        name: config
    volumeMounts:
      - mountPath: /config
        name: config
        readOnly: true

extraEnv:
  USES_PROXY_PROTOCOL: "1"
  LOAD_ENV_FROM_FILE: /config/startup.sh

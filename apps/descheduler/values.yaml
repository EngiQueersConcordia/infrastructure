deschedulerPolicy:
  profiles:
    - name: default
      pluginConfig:
        - name: "DefaultEvictor"
          args:
            minPodAge: 600s
            podProtections:
              defaultDisabled:
                - PodsWithLocalStorage
                - DaemonSetPods
                - SystemCriticalPods
        - name: "RemoveFailedPods"
          args:
            excludeOwnerKinds:
              - "Job"
            minPodLifetimeSeconds: 600
        - name: "RemoveFailedPods"
          args:
            minPodLifetimeSeconds: 86400

      plugins:
        deschedule:
          enabled:
            - "RemoveFailedPods"
    - name: high-usage
      pluginConfig:
        - name: "DefaultEvictor"
          args:
            podProtections:
              defaultDisabled:
                - PodsWithLocalStorage
              extraEnabled:
                - PodsWithPVC
        - name: "HighNodeUtilization"
          args:
            thresholds:
              "cpu": 60
              "memory": 60
              "pods": 60
            evictableNamespaces:
              exclude:
                - "kube-system"
      plugins:
        balance:
          enabled:
            - "HighNodeUtilization"
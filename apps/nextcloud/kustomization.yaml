namespace: nextcloud
helmCharts:
  - name: nextcloud
    repo: https://nextcloud.github.io/helm/
    version: 9.4.1
    releaseName: nextcloud
    namespace: nextcloud
    valuesFile: values.yaml
  - name: redis
    repo: oci://registry-1.docker.io/cloudpirates
    version: 0.39.0
    releaseName: redis
    namespace: nextcloud
    valuesFile: values-redis.yaml
resources:
  - resources/rclone/cronjob.yaml
  - resources/rclone/pvc.yaml
  - resources/cluster.yaml
  - resources/httproute.yaml
  - resources/netpol.yaml
  - resources/secrets.yaml

apiVersion: batch/v1
kind: CronJob
metadata:
  name: rclone
  namespace: nextcloud
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: rclone
              image: rclone/rclone:1.75.0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - rclone copy gdrive_engiqueers:/ local:/data/gdrive_engiqueers --config /data/rclone.conf --drive-skip-dangling-shortcuts
              volumeMounts:
                - mountPath: /data
                  name: rclone-data
          securityContext:
            runAsUser: 33
            fsGroup: 33
          restartPolicy: OnFailure
          volumes:
            - name: rclone-data
              persistentVolumeClaim:
                claimName: rclone
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-whiteboard
  labels:
    app.kubernetes.io/component: whiteboard
    app.kubernetes.io/instance: nextcloud
    app.kubernetes.io/name: nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: whiteboard
      app.kubernetes.io/instance: nextcloud
      app.kubernetes.io/name: nextcloud
  template:
    metadata:
      labels:
        app.kubernetes.io/component: whiteboard
        app.kubernetes.io/instance: nextcloud
        app.kubernetes.io/name: nextcloud
    spec:
      containers:
        - name: whiteboard
          image: "ghcr.io/nextcloud-releases/whiteboard"
          imagePullPolicy: IfNotPresent
          env:
            - name: NEXTCLOUD_URL
              value: "https://nextcloud.engiqueersconcordia.ca"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: whiteboard-jwt-secret-key
          ports:
            - name: http
              containerPort: 3002
          volumeMounts:
            - name: whiteboard-backup
              mountPath: /app/backup
          readinessProbe:
            httpGet:
              path: /status
              port: http
              scheme: HTTP
            failureThreshold: 3
            successThreshold: 1
            periodSeconds: 30
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /status
              port: http
              scheme: HTTP
            failureThreshold: 3
            successThreshold: 1
            periodSeconds: 30
            timeoutSeconds: 1
          startupProbe:
            httpGet:
              path: /status
              port: http
              scheme: HTTP
            failureThreshold: 3
            successThreshold: 1
            periodSeconds: 5
            timeoutSeconds: 1
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
      volumes:
        - name: whiteboard-backup
          emptyDir:
            sizeLimit: 500Mi

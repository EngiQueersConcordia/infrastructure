ipam:
  mode: kubernetes
kubeProxyReplacement: true
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
k8sServiceHost: localhost
k8sServicePort: 7445

hubble:
  ui:
    enabled: true
  relay:
    enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
  tls:
    auto:
      method: certmanager
      certManagerIssuerRef:
        group: cert-manager.io
        kind: Issuer
        name: ca-issuer
  metrics:
    enabled:
      - dns:query
      - flows-to-world
      - httpV2
      - drop
      - flow
    serviceMonitor:
      enabled: true
    dashboards:
      enabled: true

prometheus:
  metricsService: true
  enabled: true
  serviceMonitor:
    enabled: true
dashboards:
  enabled: true
envoy:
  prometheus:
    serviceMonitor:
      enabled: true
operator:
  prometheus:
    metricsService: true
    serviceMonitor:
      enabled: true
  dashboards:
    enabled: true

defaultLBServiceIPAM: nodeipam
nodeIPAM:
  enabled: true

gatewayAPI:
  enabled: true
  enableAlpn: true

nonIdempotentAnnotations:
  argocd.argoproj.io/compare-options: IgnoreExtraneous

hostFirewall:
  enabled: true

bpf:
  masquerade: true

upgradeCompatibility: "1.19"

nodeSelectorLabels: true
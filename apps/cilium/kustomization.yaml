helmCharts:
  - name: cilium
    repo: oci://quay.io/cilium/charts
    version: 1.19.6
    releaseName: cilium
    namespace: kube-system
    valuesFile: values.yaml
    apiVersions:
      - gateway.networking.k8s.io/v1/GatewayClass
      - monitoring.coreos.com/v1

resources:
  - resources/networkpolicy.yaml
  - resources/hostpolicy.yaml
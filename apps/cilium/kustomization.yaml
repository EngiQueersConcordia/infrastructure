helmCharts:
  - name: cilium
    repo: oci://quay.io/cilium/charts
    version: 1.20.1
    releaseName: cilium
    namespace: kube-system
    valuesFile: values.yaml
    apiVersions:
      - gateway.networking.k8s.io/v1/GatewayClass
      - monitoring.coreos.com/v1

resources:
  - resources/hostpolicy.yaml
  - resources/hubble-route.yaml
  - resources/networkpolicy.yaml

apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "host-policy"
spec:
  nodeSelector: {}
  ingress:
    - fromEntities:
        - remote-node
        - host
    - toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
            - port: "50000"
              protocol: TCP
            - port: "51820"
              protocol: UDP
    - icmps:
        - fields:
            - type: EchoRequest
              family: IPv4

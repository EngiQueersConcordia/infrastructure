apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-all-to-ingress
spec:
  endpointSelector:
    matchExpressions:
      - key: reserved:ingress
        operator: Exists
  ingress:
    - fromEntities:
        - all
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-kubedns
specs:
  - endpointSelector:
      matchLabels:
        k8s-app: kube-dns
        k8s:io.kubernetes.pod.namespace: kube-system
    ingress:
      - toPorts:
          - ports:
              - port: "53"
                protocol: "ANY"
        fromEntities:
          - cluster
  - endpointSelector: {}
    egress:
      - toPorts:
          - ports:
              - port: "53"
                protocol: "ANY"
            rules:
              dns:
                - matchPattern: "*"
        toEndpoints:
          - matchLabels:
              k8s-app: kube-dns
              k8s:io.kubernetes.pod.namespace: kube-system
    egressDeny:
      - toPorts:
          - ports:
              - port: "53"
                protocol: "ANY"
        toEntities:
          - world
    enableDefaultDeny:
      egress: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      k8s-app: hubble-ui
  ingress:
  - ports:
    - port: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-system-internal
  namespace: kube-system
spec:
  podSelector: {}
  ingress:
    - from:
        - podSelector: {}
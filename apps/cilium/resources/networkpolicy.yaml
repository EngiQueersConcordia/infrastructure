apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kubedns
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      k8s-app: kube-dns
  policyTypes:
  - Ingress
  ingress:
  - ports:
      - port: 53
apiVersion: v1
kind: Service
metadata:
  name: vivado
  namespace: user-juan
spec:
  selector:
    vm.kubevirt.io/name: vivado
  ports:
    - protocol: TCP
      port: 22
      targetPort: 22
      name: ssh
    - protocol: TCP
      port: 5901
      targetPort: 5901
      name: vnc
  type: ClusterIP
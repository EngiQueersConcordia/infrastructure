apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: authentik-server
  namespace: authentik
spec:
  from:
    - group: 'gateway.networking.k8s.io'
      kind: HTTPRoute
      namespace: 'prometheus-stack'
    - group: 'gateway.networking.k8s.io'
      kind: HTTPRoute
      namespace: 'kube-system'
  to:
    - group: ''
      kind: Service
      name: authentik-server

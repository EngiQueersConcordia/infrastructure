apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-db
  namespace: authentik
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: authentik-db
  ingress:
    - ports:
        - port: postgresql
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: worker
              app.kubernetes.io/instance: authentik
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: server
              app.kubernetes.io/instance: authentik
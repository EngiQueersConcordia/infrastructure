apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-pg-operator
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/managed-by: cloudnative-pg
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cnpg-system
resources:
  requests:
    memory: 8Gi

minecraftServer:
  eula: "TRUE"
  version: "1.21.1"
  type: "NEOFORGE"
  ops: ""
  gameMode: "survival"
  motd: "EngiQueers Create Aeronautics Server"
  levelSeed: "-3914927686592952"

  memory: 8G
  rcon:
    enabled: true
    withGeneratedPassword: true

  jvmXXOpts: "-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1 -Dusing.aikars.flags=https://mcflags.emc.gs -Daikars.new.flags=true"

persistence:
  dataDir:
    enabled: true
    Size: 45Gi
    existingClaim: modded-mc-datadir

strategyType: RollingUpdate
serviceAnnotations:
  "mc-router.itzg.me/externalServerName": "engiqueersconcordia.ca"

startupProbe:
  failureThreshold: 90

extraVolumes:
  - volumes:
      - configMap:
          name: mc-config
          defaultMode: 0777
        name: config
    volumeMounts:
      - mountPath: /config
        name: config
        readOnly: true

extraEnv:
  USES_PROXY_PROTOCOL: "1"
  LOAD_ENV_FROM_FILE: /config/startup.sh
  GENERIC_PACK: https://github.com/EngiQueersConcordia/mc-f26/releases/download/v1.1/mc-f26-server.zip,https://github.com/EngiQueersConcordia/mc-f26/releases/download/v1.1/mc-f26-serverextras.zip,https://github.com/EngiQueersConcordia/mc-f26/releases/download/v1.1/mc-f26-baseconfig.zip
  GENERIC_PACKS_DISABLE_MODS: |
    sodium-neoforge-0.8.13+mc1.21.1.jar
    sodium-extra-neoforge-0.9.3+mc1.21.1.jar

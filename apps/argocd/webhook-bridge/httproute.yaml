apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/name: webhook-bridge
  name: webhook-bridge
  namespace: argocd
spec:
  hostnames:
    - argocd.engiqueersconcordia.ca
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: engiqueers
      namespace: ingress
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: webhook-bridge
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /api/webhook

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: main
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://codeberg.org/EngiQueers-Concordia/infrastructure.git
        revision: test
        directories:
          - path: apps/*
  template:
    metadata:
      name: '{{.path.basename}}'
    spec:
      project: "default"
      source:
        repoURL: https://codeberg.org/EngiQueers-Concordia/infrastructure.git
        targetRevision: test
        path: '{{.path.path}}'
      destination:
        name: in-cluster
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
          allowEmpty: false
          
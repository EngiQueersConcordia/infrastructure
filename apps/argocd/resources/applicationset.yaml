apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: main
  namespace: argocd
spec:
#  ignoreApplicationDifferences:
#    - jsonPointers:
#        - /spec/syncPolicy
  syncPolicy:
    applicationsSync: create-update
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://codeberg.org/EngiQueers-Concordia/infrastructure.git
        revision: HEAD
        directories:
          - path: apps/*
        files:
          - path: apps/*/config.yaml
  template:
    metadata:
      name: '{{.path.basename}}'
      labels:
        test: "{{.path.filename}}"
    spec:
      project: "default"
      source:
        repoURL: https://codeberg.org/EngiQueers-Concordia/infrastructure.git
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        name: in-cluster
      syncPolicy:
        automated:
          enabled: false
          prune: false
          selfHeal: false
          allowEmpty: false
#  templatePatch:

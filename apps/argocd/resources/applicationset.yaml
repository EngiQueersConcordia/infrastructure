apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: main
  namespace: argocd
spec:
#  ignoreApplicationDifferences:
#    - jsonPointers:
#        - /spec/syncPolicy
  syncPolicy:
    applicationsSync: create-update
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - merge:
        generators:
          - git:
              repoURL: https://codeberg.org/EngiQueers-Concordia/infrastructure.git
              revision: HEAD
              directories:
                - path: apps/*
          - git:
              repoURL: https://codeberg.org/EngiQueers-Concordia/infrastructure.git
              revision: HEAD
              files:
                - path: apps/*/config.yaml
        mergeKeys:
          - path
  template:
    metadata:
      name: '{{.path.basename}}'
      labels:
        test: '{{ or (index .path "filename") "Directory" }}'
    spec:
      project: "default"
      source:
        repoURL: https://codeberg.org/EngiQueers-Concordia/infrastructure.git
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        name: in-cluster
      syncPolicy:
        automated:
          enabled: false
          prune: false
          selfHeal: false
          allowEmpty: false

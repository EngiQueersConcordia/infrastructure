# pk: Personal Key
# rk: Recovery Framgment Key
# fk: Full Recovery Key
# ak: Application Key
# kg: Key Group
# p: Preset
keys:
  - pk-alexkar598: &pk-alexkar598
      age:
        # Orion
        - ""
        # Hermes
        - ""
  - pk-casey: &pk-casey
      age:
        - ""
  - fk: &fk
      age:
        - ""
key_groups:
  kg-main: &kg-main
    merge:
      - *fk
      - *pk-alexkar598
      - *pk-casey
presets:
  p-main: &p-main
    - merge:
        - *kg-main


creation_rules:
  - path_regex: "apps/.*\\.sops\\.yaml"
    key_groups: *p-main
    encrypted_regex: "^(stringData)$"
    mac_only_encrypted: true

  - path_regex: "talos/patches/.*/wireguard.*\\.yaml"
    key_groups: *p-main
    encrypted_regex: "^(privateKey)$"
    mac_only_encrypted: true

  - path_regex: "talos/patches/.*/disk.*\\.yaml"
    key_groups: *p-main
    encrypted_regex: "^(passphrase)$"
    mac_only_encrypted: true

  - key_groups: *p-main